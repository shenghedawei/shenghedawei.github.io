<style>

  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

    box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .controls-tip{font-size:13px;color:var(--muted);margin-bottom:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border:1px solid var(--line);background:#fff;border-radius:22px;font-size:14px;cursor:pointer;
    color:var(--ink);transition:.15s;line-height:1.2;white-space:nowrap}
  .chip:hover{background:#f1f5f9;border-color:#cbd5e1}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 6px rgba(31,111,235,.3)}
  .chip .cnote{font-size:11px;opacity:.85;margin-left:3px}
  .meta{margin:12px 2px 0;font-size:13px;color:var(--muted)}
  .meta b{color:var(--brand)}
  details.prov{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
  details.prov>summary{cursor:pointer;padding:13px 15px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;list-style:none}
  details.prov>summary::-webkit-details-marker{display:none}
  details.prov>summary .cnt{font-size:12px;color:var(--muted);font-weight:500}
  details.prov>summary .note{font-size:12px;color:var(--warn);font-weight:500;margin-left:auto}
  details.prov[open]>summary{border-bottom:1px solid var(--line);background:var(--brand-soft)}
  .prov-body{padding:12px 14px}
  .card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;background:#fff}
  .card:last-child{margin-bottom:0}
  .card .region{font-weight:700;font-size:16px;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .region .tag{font-size:11px;background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:20px;font-weight:600}
  .row{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14.5px}
  .row:first-of-type{border-top:none}
  .row .k{flex:0 0 92px;color:var(--muted);font-weight:600}
  .row .v{flex:1;white-space:pre-wrap;word-break:break-word}
  .ref{background:var(--ref);border:1px solid var(--ref-border);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  .ref .rtitle{font-weight:700;color:var(--warn);font-size:14px;margin-bottom:6px}
  .nomsg{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .nomsg .nt{font-weight:700;font-size:16px;color:#b45309}
  .nomsg .ns{font-size:14px;color:#92400e;margin-top:4px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
</style>
</head>

 "新疆": [{"row": 44, "province": "新疆", "region": "", "trial": "", "formal": "自2025年4月7日实施\n（其中提供保司3个月窗口期开发可回溯系统）", "scope": "自保件和互保件双录：\n保险机构应严格按照“销售行为可回溯”制度执行，对保险期间超过一年的人身保险产品（含保险期间不超过一年但保证续保的人身保险产品，不含团体保险和政策性保险产品，电话销售业务和互联网保险业务除外）自保件和互保件销售过程关键环节以现场同步录音录像（以下简称“双录”）的方式予以记录。\n\n（自保件：指销售人员本人或其配偶、父母、子女等直系亲属作为投保人、被保险人或受益人的保险合同；互保件，是指由销售人员销售，投保人、被保险人或受益人为同一保险机构另一名销售人员或其配偶、父母、子女等直系亲属的保险合同）", "province_name": "新疆", "province_note": ""}]}};
const KEY = 'dblv_selected_province';
const chips = document.getElementById('chips');
const content = document.getElementById('content');
const meta = document.getElementById('meta');

let selected = '__ALL__';   // 当前选中的省份（长期记住）

function regionLabel(rec){
  const r = rec.region;
  if(!r || r.indexOf('全省')>=0 || r.indexOf('全辖')>=0) return null;
  return r;
}
function groupByRegion(records){
  const map = new Map();
  for(const rec of records){
    const k = regionLabel(rec) || '__PROV__';
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(rec);
  }
  return map;
}
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function cardHTML(rec, idx, total){
  const rl = regionLabel(rec);
  const regionName = rl || (rec.province_name + '（全省/全市）');
  let h = '<div class="card"><div class="region"><span>'+esc(regionName)+'</span>';
  if(!rl) h += '<span class="tag">全省</span>';
  if(total>1) h += '<span class="tag">阶段 '+idx+'/'+total+'</span>';
  h += '</div>';
  if(rec.trial) h += '<div class="row"><div class="k">试行期间</div><div class="v">'+esc(rec.trial)+'</div></div>';
  if(rec.formal) h += '<div class="row"><div class="k">正式执行</div><div class="v">'+esc(rec.formal)+'</div></div>';
  if(rec.scope) h += '<div class="row"><div class="k">双录范围</div><div class="v">'+esc(rec.scope)+'</div></div>';
  h += '</div>';
  return h;
}

function nationalRefHTML(){
  const nat = DATA.groups['全国']||[];
  if(!nat.length) return '';
  const inner = cardHTML(nat[0],1,1).replace('<div class="card">','<div class="card" style="margin:0;border:none;padding:0;box-shadow:none">');
  return '<div class="ref"><div class="rtitle">全国基准政策（2017 · 适用于所有地区）</div>'+inner+'</div>';
}

function provinceSection(name, note, records){
  const map = groupByRegion(records);
  let h = '<details class="prov" open><summary>'+esc(name);
  if(note) h += '<span class="note">'+esc(note)+'</span>';
  h += '<span class="cnt">· '+records.length+' 条政策</span></summary><div class="prov-body">';
  const keys = [...map.keys()];
  for(const k of keys){
    const recs = map.get(k);
    recs.forEach((rec,i)=>{ h += cardHTML(rec, i+1, recs.length); });
  }
  h += '</div></details>';
  return h;
}

function countRegional(){let n=0;for(const p of DATA.provinces){if(p.name!=='全国')n+=(DATA.groups[p.name]||[]).length;}return n;}

function renderAll(){
  let h = nationalRefHTML();   // 全国基准默认显示在顶部
  for(const p of DATA.provinces){
    if(p.name==='全国') continue;
    h += provinceSection(p.name, p.note, DATA.groups[p.name]||[]);
  }
  content.innerHTML = h;
  meta.innerHTML = '当前显示：<b>全部地区（含全国基准）</b> · 共 '+countRegional()+' 个地区政策 + 全国基准';
}

function renderOne(name){
  const p = DATA.provinces.find(x=>x.name===name);
  const records = DATA.groups[name]||[];
  let h = nationalRefHTML();   // 选中省份时，顶部附全国基准作参照
  h += provinceSection(name, p?p.note:'', records);
  content.innerHTML = h;
  meta.innerHTML = '当前显示：<b>'+esc(name)+(p&&p.note?('（'+esc(p.note)+'）'):'')+'</b> · 共 '+records.length+' 条政策（已记住此选择，刷新仍只显示该省）';
}

// 省份按钮：只列出真实有信息的地区，避免乱输入
function buildChips(){
  let html = '<button class="chip" data-v="__ALL__">全部 / 全国</button>';
  for(const p of DATA.provinces){
    if(p.name==='全国') continue;
    const label = esc(p.name) + (p.note?('<span class="cnote">'+esc(p.note)+'</span>'):'');
    html += '<button class="chip" data-v="'+esc(p.name)+'">'+label+'</button>';
  }
  chips.innerHTML = html;
  chips.querySelectorAll('.chip').forEach(b=>{
    b.addEventListener('click', ()=> apply(b.dataset.v));
  });
}

function apply(value){
  selected = value;
  // 高亮当前选中
  chips.querySelectorAll('.chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.v===value);
  });
  if(!value || value==='__ALL__'){ renderAll(); }
  else { renderOne(value); }
  try{ localStorage.setItem(KEY, value); }catch(e){}
}

// 初始化：读取记住的省份
buildChips();
try{ selected = localStorage.getItem(KEY) || '__ALL__'; }catch(e){}
if(!(selected && selected!=='__ALL__' && DATA.groups[selected])) selected='__ALL__';
apply(selected);
</script>
